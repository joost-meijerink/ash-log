      <stop offset="0" stop-color="#2a231b"/>
      <stop offset="1" stop-color="#15120e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b5840"/>
      <stop offset="0.5" stop-color="#3a2f22"/>
      <stop offset="1" stop-color="#2a2219"/>
    </linearGradient>
    <clipPath id="clip"><use href="#body"/></clipPath>
  </defs>
  <path id="body" d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#leather)"/>
  <use href="#body" fill="none" stroke="url(#rim)" stroke-width="16" clip-path="url(#clip)"/>
