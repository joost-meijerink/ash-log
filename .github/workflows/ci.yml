# Typecheck, tests, build and a smoke test of the app server on Windows, macOS and Linux.
# Never syncs with the wiki (tests run against fixtures) and never starts a browser.
# Tests that only make sense on macOS (the Swift app, caffeinate, Apple's certificate check)
# skip themselves elsewhere.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Smoke test of the app server
        run: node .github/scripts/smoke-app.mjs

      # Windows only: the Start menu launcher (scripts/windows). Start, check and stop in one step,
      # so no server outlives it. dist/ is fresh from the Build step, so the launcher does not build.
      - name: Windows launcher (start, status, stop)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASHENFALL_PORT: '5299'
          ASH_LOG_LOCAL_DIR: ${{ runner.temp }}\ash-log-local
          ASHENFALL_START_TIMEOUT: '120'
        run: |
          node --import tsx scripts/windows/launcher.ts --no-browser
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ASH_LOG_LOCAL_DIR\server.log" -ErrorAction SilentlyContinue; exit 1 }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:5299/api/health' -TimeoutSec 10
          if ($health.mode -ne 'app') { Write-Error 'unexpected /api/health'; exit 1 }
          node --import tsx scripts/windows/launcher.ts --status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --import tsx scripts/windows/launcher.ts --stop
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:ASH_LOG_LOCAL_DIR\server.log"; exit 1 }
          node --import tsx scripts/windows/launcher.ts --status
          if ($LASTEXITCODE -eq 0) { Write-Error 'server still running after --stop'; exit 1 }
          Get-Content "$env:ASH_LOG_LOCAL_DIR\server.log"
          # The deliberate 1 of the last --status would otherwise fail the step.
          exit 0

      - name: Windows Start menu shortcuts (install, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run app:install -- --desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $programs = [Environment]::GetFolderPath('Programs')
          foreach ($name in 'Ash Log', 'Stop Ash Log') {
            $path = Join-Path $programs "$name.lnk"
            if (-not (Test-Path -LiteralPath $path)) { Write-Error "missing: $path"; exit 1 }
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($path)
            Write-Output "$name -> $($link.TargetPath) $($link.Arguments) [$($link.WorkingDirectory)]"
          }
          npm run app:uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($name in 'Ash Log', 'Stop Ash Log') {
            if (Test-Path -LiteralPath (Join-Path $programs "$name.lnk")) { Write-Error "still there: $name"; exit 1 }
          }
          exit 0

  # The desktop app (Electron): package it unpacked for this platform and start it with --smoke,
  # which starts the app server, checks the app page and the bundled wiki data, and quits. No window.
  desktop:
    name: Desktop app, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the front end and bundle the main process
        run: |
          npx vite build
          npx tsx electron/build.ts

      - name: Package (unpacked)
        run: npx tsx electron/dist.ts --dir

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          ASH_LOG_USER_DATA: ${{ runner.temp }}/ash-log-user
          ASH_LOG_PORT: '5299'
        run: |
          app="$(node -p "require('os').tmpdir()")/ash-log-release/mac-arm64/Ash Log.app"
          codesign --verify --deep "$app"
          "$app/Contents/MacOS/Ash Log" --smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASH_LOG_USER_DATA: ${{ runner.temp }}\ash-log-user
          ASH_LOG_PORT: '5299'
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          $exe = Join-Path ([IO.Path]::GetTempPath()) 'ash-log-release\win-unpacked\Ash Log.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow
          Get-Content (Join-Path $env:ASH_LOG_USER_DATA 'server\server.log') -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "smoke test failed with exit code $($p.ExitCode)"; exit 1 }
          exit 0
